<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TOP登陆少年 · 卖腐系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== 像素字体 @font-face (汉字像素风兜底) ===== */
        @font-face {
            font-family: 'PixelCJK';
            src: local('DotGothic16'), local('Zpix'), local('Unifont');
        }

        /* ===== CSS变量 / 设计Token ===== */
        :root {
            --pink-0: #fff0f5;
            --pink-1: #ffd6e7;
            --pink-2: #ffadd1;
            --pink-3: #e88aaa;
            --pink-4: #c96080;
            --pink-5: #8b3358;
            --cream: #fff8f0;
            --gold: #f5c842;
            --gold-dark: #c8960a;
            --shadow: #c96080;
            --border: 3px solid var(--pink-3);
            --pixel-r: 0px;
        }

        /* ===== 重置 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        /* ===== 背景：像素点阵纹理 ===== */
        body {
            background-color: #ffe4f0;
            background-image:
                linear-gradient(rgba(200, 96, 128, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 96, 128, 0.07) 1px, transparent 1px);
            background-size: 16px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px 40px;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
        }

        /* ===== 像素装饰：浮动背景元素 ===== */
        body::before {
            content: '★ ♥ ✿ ★ ♥ ✿ ★ ♥ ✿ ★ ♥ ✿ ★ ♥ ✿ ★ ♥ ✿';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            font-size: 13px;
            color: rgba(200, 96, 128, 0.18);
            letter-spacing: 12px;
            white-space: nowrap;
            overflow: hidden;
            padding: 6px 0;
            pointer-events: none;
            font-family: monospace;
        }

        /* ===== 主容器：像素窗口风格 ===== */
        .game-container {
            max-width: 680px;
            width: 100%;
            background: var(--pink-0);
            border: 3px solid var(--pink-3);
            box-shadow:
                4px 0 0 0 var(--pink-3),
                0 4px 0 0 var(--pink-3),
                4px 4px 0 0 var(--shadow),
                8px 8px 0 0 rgba(200, 96, 128, 0.25);
            position: relative;
            padding: 0 0 16px;
            margin-top: 8px;
        }

        /* 像素窗口标题栏 */
        .window-titlebar {
            background: var(--pink-3);	
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid var(--pink-5);
        }

        .window-dots {
            display: flex;
            gap: 5px;
        }

        .window-dot {
            width: 10px;
            height: 10px;
            border: 2px solid var(--pink-5);
            background: var(--pink-1);
            display: inline-block;
        }

        .window-dot:first-child {
            background: #ffb3c6;
        }
        .window-dot:nth-child(2) {
            background: #ffd6a5;
        }
        .window-dot:nth-child(3) {
            background: #b5ead7;
        }

        .window-title-text {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--pink-0);
            letter-spacing: 2px;
            font-family: 'Pixelify Sans', monospace;
            text-shadow: 1px 1px 0 var(--pink-5);
        }

        /* ===== 像素装饰条带 ===== */
        .pixel-band {
            height: 6px;
            background: repeating-linear-gradient(90deg,
                    var(--pink-2) 0px,
                    var(--pink-2) 8px,
                    var(--pink-1) 8px,
                    var(--pink-1) 16px,
                    var(--pink-3) 16px,
                    var(--pink-3) 24px,
                    var(--gold) 24px,
                    var(--gold) 32px);
        }

        /* ===== 内容区 ===== */
        .game-inner {
            padding: 16px 20px 0;
        }

        /* ===== 顶部信息栏 ===== */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .role-tag {
            background: var(--pink-3);
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 14px 5px;
            border: 2px solid var(--pink-5);
            box-shadow: 2px 2px 0 var(--pink-5);
            font-family: 'Pixelify Sans', monospace;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .week-tag {
            background: var(--gold);
            color: var(--pink-5);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px 5px;
            border: 2px solid var(--gold-dark);
            box-shadow: 2px 2px 0 var(--gold-dark);
            font-family: 'Pixelify Sans', monospace;
            letter-spacing: 1px;
        }

        /* ===== 故事面板 ===== */
        .story-panel {
            background: var(--cream);
            border: 2px solid var(--pink-3);
            box-shadow: 3px 3px 0 var(--shadow);
            padding: 16px 18px;
            min-height: 120px;
            margin-bottom: 14px;
            position: relative;
        }

        /* 角落像素装饰 */
        .story-panel::before,
        .story-panel::after {
            content: '◆';
            position: absolute;
            font-size: 8px;
            color: var(--pink-3);
            font-family: monospace;
        }
        .story-panel::before {
            top: 4px;
            left: 4px;
        }
        .story-panel::after {
            bottom: 4px;
            right: 4px;
        }

        .story-text {
            color: #5a2d42;
            font-size: 0.88rem;
            line-height: 1.85;
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
        }

        .story-text strong {
            color: var(--pink-4);
            font-weight: 800;
        }

        /* ===== 数值面板 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--pink-1);
            border: 2px solid var(--pink-3);
            box-shadow: 2px 2px 0 var(--shadow);
            padding: 8px 4px 10px;
            text-align: center;
            position: relative;
        }

        /* 像素角标 */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background: var(--pink-3);
        }

        .stat-label {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--pink-4);
            margin-bottom: 2px;
            font-family: 'Pixelify Sans', monospace;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--pink-5);
            line-height: 1.1;
            font-family: 'Pixelify Sans', monospace;
            text-shadow: 1px 0 0 var(--pink-3), 0 1px 0 var(--pink-3);
        }

        .stat-bar {
            margin-top: 5px;
            height: 6px;
            background: var(--pink-2);
            border: 1px solid var(--pink-3);
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.2s steps(10);
        }

        .fill-health {
            background: #ff6b9d;
        }
        .fill-skill {
            background: #ff9eb5;
        }
        .fill-accept {
            background: #c96080;
        }
        .fill-fans {
            background: var(--gold);
        }

        /* ===== 像素分隔线 ===== */
        .divider {
            height: 4px;
            background: repeating-linear-gradient(90deg,
                    var(--pink-3) 0px, var(--pink-3) 6px,
                    transparent 6px, transparent 10px);
            margin: 2px 0 14px;
        }

        /* ===== 按钮共用基础 ===== */
        .px-btn {
            background: var(--pink-1);
            border: 2px solid var(--pink-3);
            box-shadow: 3px 3px 0 var(--shadow);
            padding: 12px 8px;
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--pink-5);
            letter-spacing: 0.8px;
            cursor: pointer;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
            text-align: center;
            line-height: 1.5;
            transition: box-shadow 0.05s, transform 0.05s;
            display: block;
            width: 100%;
            position: relative;
        }

        .px-btn:hover {
            background: var(--pink-2);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .px-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        /* ===== 行动按钮组 ===== */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 4px;
        }

        .action-btn {
            composes: px-btn;
            background: var(--pink-1);
            border: 2px solid var(--pink-3);
            box-shadow: 3px 3px 0 var(--shadow);
            padding: 13px 8px;
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--pink-5);
            letter-spacing: 0.8px;
            cursor: pointer;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
            text-align: center;
            line-height: 1.5;
            transition: box-shadow 0.05s, transform 0.05s;
            position: relative;
        }

        .action-btn::after {
            content: '▶';
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 7px;
            color: var(--pink-3);
            font-family: monospace;
        }

        .action-btn:hover {
            background: var(--pink-2);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        /* ===== 队友选择 ===== */
        .teammate-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .teammate-btn {
            background: var(--pink-1);
            border: 2px solid var(--pink-3);
            box-shadow: 3px 3px 0 var(--shadow);
            padding: 14px 8px;
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--pink-5);
            cursor: pointer;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
            text-align: center;
            line-height: 1.5;
            transition: box-shadow 0.05s, transform 0.05s;
            letter-spacing: 0.5px;
        }

        .teammate-btn:hover {
            background: var(--pink-2);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .teammate-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        .back-btn {
            grid-column: span 2;
            background: var(--cream);
            border-color: var(--pink-2);
            color: var(--pink-4);
            box-shadow: 3px 3px 0 var(--pink-2);
        }

        /* ===== 页脚 ===== */
        footer {
            font-size: 0.62rem;
            text-align: center;
            padding: 12px 0 4px;
            color: var(--pink-4);
            border-top: 2px dashed var(--pink-2);
            margin: 14px 20px 0;
            letter-spacing: 1.5px;
            font-family: 'Pixelify Sans', monospace;
            font-weight: 600;
        }

        /* ===== 像素装饰SVG元素 ===== */
        .px-deco-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 4px;
            color: var(--pink-3);
            font-size: 12px;
            font-family: monospace;
            letter-spacing: 6px;
            opacity: 0.65;
        }

        /* ===== 首页 ===== */
        .home-title {
            text-align: center;
            padding: 10px 0 6px;
        }

        .home-title .main {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--pink-4);
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: 'Pixelify Sans', monospace;
            text-shadow: 2px 2px 0 var(--pink-2), 1px 1px 0 var(--pink-3);
            display: block;
            margin-bottom: 4px;
        }

        .home-title .main-jp {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 2px 0 0 var(--gold-dark), 0 2px 0 var(--gold-dark), 2px 2px 0 var(--gold-dark);
            letter-spacing: 3px;
            display: block;
            margin-bottom: 6px;
        }

        .home-title .sub {
            font-size: 0.72rem;
            color: var(--pink-4);
            letter-spacing: 0.8px;
            line-height: 1.7;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
        }

        /* ===== 结局样式 ===== */
        .ending-title {
            text-align: center;
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--pink-4);
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
            letter-spacing: 1px;
        }

        .ending-body {
            font-size: 0.85rem;
            line-height: 1.9;
            padding: 0 4px;
            color: #5a2d42;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .restart-btn,
        .preview-btn {
            background: var(--pink-3);
            border: 2px solid var(--pink-5);
            box-shadow: 3px 3px 0 var(--pink-5);
            padding: 13px 28px;
            font-weight: 700;
            color: white;
            font-size: 0.88rem;
            cursor: pointer;
            font-family: 'Pixelify Sans', 'PingFang SC', 'Microsoft YaHei', monospace;
            letter-spacing: 1px;
            transition: box-shadow 0.05s, transform 0.05s;
            margin: 8px auto;
            display: block;
            text-shadow: 1px 1px 0 var(--pink-5);
        }

        .restart-btn:hover,
        .preview-btn:hover {
            background: var(--pink-4);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--pink-5);
        }

        .restart-btn:active,
        .preview-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--pink-5);
        }

        /* ===== 像素角落装饰 SVG ===== */
        .corner-deco {
            position: absolute;
            pointer-events: none;
        }

        /* ===== 像素星星/爱心装饰行 ===== */
        .deco-strip {
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 4px;
            text-align: center;
            color: var(--pink-3);
            opacity: 0.5;
            padding: 2px 0;
            overflow: hidden;
            white-space: nowrap;
        }

        /* ===== 侧边装饰条 ===== */
        .side-deco-left,
        .side-deco-right {
            position: absolute;
            top: 40px;
            font-family: monospace;
            font-size: 10px;
            color: var(--pink-2);
            writing-mode: vertical-rl;
            letter-spacing: 6px;
            pointer-events: none;
            line-height: 1;
        }
        .side-deco-left {
            left: -20px;
            text-orientation: mixed;
        }
        .side-deco-right {
            right: -20px;
            transform: rotate(180deg);
        }

        /* ===== 闪烁动画（像素感，仅关键帧切换）===== */
        @keyframes pixelBlink {
            0%,
            49% {
                opacity: 1;
            }
            50%,
            100% {
                opacity: 0;
            }
        }

        .blink {
            animation: pixelBlink 1.1s steps(1) infinite;
        }

        /* ===== 像素进度点 ===== */
        .week-pip-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 6px 0 10px;
        }

        .week-pip {
            width: 8px;
            height: 8px;
            border: 1px solid var(--pink-3);
            display: inline-block;
        }

        .week-pip.filled {
            background: var(--pink-3);
        }
        .week-pip.current {
            background: var(--gold);
            border-color: var(--gold-dark);
        }

        /* ================================================================
           角色选择页面专用：标题背景块 — 保持用户之前的紧凑调整
           ================================================================ */
        .role-select-title {
            min-height: auto !important;
            margin-top: 2px !important;
            margin-bottom: 2px !important;
            padding: 2px 14px !important;
            box-shadow: 3px 3px 0 var(--shadow) !important;
        }

        .role-select-title .story-text {
            font-size: 0 !important;
        }

        .role-select-title .home-title {
            padding: 0 !important;
            text-align: center !important;
        }

        .role-select-title .home-title .main-jp {
            font-size: 1.35rem !important;
            margin-bottom: 0 !important;
            line-height: 1.2 !important;
            display: block !important;
        }

        .role-select-title .home-title .main {
            font-size: 1.05em !important;
            margin-bottom: 0 !important;
            line-height: 1.2 !important;
            display: block !important;
        }

        .role-select-title .home-title .sub {
            font-size: 0.75rem !important;
            line-height: 1.3 !important;
            margin-top: 1px !important;
            text-align: center !important;
            display: block !important;
            letter-spacing: 0.6px !important;
        }

        /* ================================================================
           角色选择页面专用：按钮更小 + 间距更松散
           ================================================================ */
        .role-select-grid {
            gap: 18px !important;
            margin-top: 8px !important;
        }

        .role-select-grid .teammate-btn {
            padding: 10px 8px !important;
            font-size: 0.78rem !important;
            box-shadow: 2px 2px 0 var(--shadow) !important;
            border-width: 2px !important;
            line-height: 1.3 !important;
        }

        .role-select-grid .teammate-btn .role-icon {
            font-size: 0.9rem !important;
            margin-bottom: 1px !important;
            display: block !important;
            color: var(--pink-4) !important;
        }

        .role-select-grid .teammate-btn .role-name {
            font-size: 0.8rem !important;
            display: block !important;
            font-weight: 700 !important;
            color: var(--pink-5) !important;
        }

        .role-select-grid .teammate-btn .role-sub {
            font-size: 0.5rem !important;
            margin-top: 1px !important;
            letter-spacing: 0.5px !important;
            display: block !important;
            color: var(--pink-3) !important;
        }

        /* 角色选择页面装饰条间距 */
        .role-select-deco {
            margin: 6px 0 14px !important;
        }

        /* 响应式：手机 */
        @media (max-width: 540px) {
            .role-select-title {
                padding: 2px 12px !important;
                margin-top: 1px !important;
                margin-bottom: 1px !important;
            }
            .role-select-title .home-title .main-jp {
                font-size: 1.1rem !important;
                line-height: 1.1 !important;
            }
            .role-select-title .home-title .main {
                font-size: 0.8rem !important;
                line-height: 1.1 !important;
            }
            .role-select-title .home-title .sub {
                font-size: 0.6rem !important;
                line-height: 1.2 !important;
                margin-top: 0 !important;
            }

            .role-select-grid {
                gap: 14px !important;
                margin-top: 6px !important;
            }
            .role-select-grid .teammate-btn {
                padding: 8px 6px !important;
                font-size: 0.7rem !important;
            }
            .role-select-grid .teammate-btn .role-icon {
                font-size: 0.8rem !important;
            }
            .role-select-grid .teammate-btn .role-name {
                font-size: 0.72rem !important;
            }
            .role-select-grid .teammate-btn .role-sub {
                font-size: 0.45rem !important;
            }
            .role-select-deco {
                margin: 4px 0 10px !important;
            }
        }

        @media (max-width: 400px) {
            .role-select-title {
                padding: 2px 10px !important;
            }
            .role-select-title .home-title .main-jp {
                font-size: 0.95rem !important;
            }
            .role-select-title .home-title .main {
                font-size: 0.7rem !important;
            }
            .role-select-title .home-title .sub {
                font-size: 0.52rem !important;
                line-height: 1.1 !important;
            }

            .role-select-grid {
                gap: 10px !important;
                margin-top: 4px !important;
            }
            .role-select-grid .teammate-btn {
                padding: 6px 4px !important;
                font-size: 0.65rem !important;
            }
            .role-select-grid .teammate-btn .role-icon {
                font-size: 0.7rem !important;
            }
            .role-select-grid .teammate-btn .role-name {
                font-size: 0.65rem !important;
            }
            .role-select-grid .teammate-btn .role-sub {
                font-size: 0.4rem !important;
                margin-top: 0 !important;
            }
            .role-select-deco {
                margin: 2px 0 8px !important;
            }
        }

        /* ===== 其他全局响应式 ===== */
        @media (max-width: 540px) {
            .game-inner {
                padding: 12px 12px 0;
            }
            .stat-value {
                font-size: 1.35rem;
            }
            .stats-grid {
                gap: 6px;
            }
            .action-buttons {
                gap: 8px;
            }
            .home-title .main-jp {
                font-size: 1.3rem;
            }
            .home-title .main {
                font-size: 1.1rem;
            }
            .story-text {
                font-size: 0.82rem;
            }
        }

        @media (max-width: 400px) {
            .game-inner {
                padding: 10px 10px 0;
            }
            .stat-value {

                    "年终总结时你们互相评价，你说「他是个很认真的人」，他说「他也是」——简单但真诚，你们对视了一眼，然后各自移开了目光。"
                ],

                    "你们一起练舞练到很晚，张极给你带了夜宵，说「我猜你肯定没吃饭」，你接过那碗热腾腾的馄饨，觉得这个人真的很会照顾人。",

                ],
                zh: [
                    "你胃疼得不想动，窝在沙发里刷手机，过了一会儿张泽禹走过来，默默放了一盒胃药和一壶热水在你面前，什么也没说就走了。你看着那盒药，发现是你常吃的那种牌子，你都不知道他什么时候注意到的。",

                    "你们在阳台吹风，苏新皓突然说「我觉得你有时候想太多了」，你看了他一眼，他继续说「但也挺正常的，谁不想呢」，你没接话，但你知道他在说他自己，你接了一句「你也别想太多」，他愣了一下，然后笑了。",
                    "左航说自己睡醒脸上总有猫毛，你给他送了一台宠物专用空气净化器。"
                ]
            }
        };


        /* ============================================================
           工具函数
        ============================================================ */
        function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function getStory(playerId, targetId) {
            const stories = cpStories[playerId];
            if (!stories) return "你们相视一笑，空气里弥漫着微妙的默契。";
            const list = stories[targetId];
            if (!list || list.length === 0) return "你们在走廊擦肩而过，谁都没说话，但好像什么都说了。";
            return pickRandom(list);
        }

        /* ============================================================
           核心逻辑 (不变)
        ============================================================ */
        function initGame(roleId) {
            const role = roles[roleId];
            game.playerId = roleId;
            game.playerName = role.name;
            game.life = role.life;
            game.skill = role.skill;
            game.teamAccept = role.accept;
            game.fans = role.fans;
            game.soloFans = role.soloBase;
            game.cpFans = role.cpBase;
            game.groupFans = role.groupBase;
            const initFavor = {
                zx: { zx: 50, zby: 45, zj: 45, zh: 45, sxh: 60 },
                zby: { zx: 45, zby: 50, zj: 85, zh: 82, sxh: 20 },
                zj: { zx: 45, zby: 85, zj: 50, zh: 65, sxh: 85 },
                zh: { zx: 45, zby: 82, zj: 65, zh: 50, sxh: 70 },
                sxh: { zx: 60, zby: 20, zj: 85, zh: 70, sxh: 50 }
            };
            game.favor = { ...initFavor[roleId] };
            game.relation = { zx_zby: 50, zx_zj: 50, zx_zh: 50, zx_sxh: 60, zby_zj: 85, zby_zh: 82, zby_sxh: 20,
            zj_zh: 65, zj_sxh: 85, zh_sxh: 70 };
            game.coldWarRemain = 3;
            game.sabotageSuccess = 0;
            game.consecutiveTrain = 0;
            game.zx_noSuCounter = 0;
            game.sxh_noZxCounter = 0;
            game.lastSpecialEvent = false;
            game.nextEventWeek = 2;
            game.gameOver = false;
            game.ending = null;
            game.week = 1;
            game.lastAction = null;
            game.lastTarget = null;
            game.earlyWarningUsed = false;
            game.cpCounts = { zx: 0, zby: 0, zj: 0, zh: 0, sxh: 0 };
            game.rumorTriggered = false;
            recalcTeamAccept();
            recalcFansFromStruct();
        }

        function recalcFansFromStruct() {
            game.fans = Math.min(100, Math.max(0, Math.floor(game.soloFans * 0.5 + game.cpFans * 0.3 + game.groupFans *
            0.2)));
        }

        function recalcTeamAccept() {
            const pid = game.playerId;
            let others = ['zx', 'zby', 'zj', 'zh', 'sxh'].filter(id => id !== pid);
            let total = 0;
            for (let oid of others) {
                let val = game.favor[oid],
                    coef = 1;
                if (val > 80) coef = 1.5;
                if (val < 20) coef = 1.3;
                total += val * coef;
            }
            game.teamAccept = Math.min(100, Math.max(0, Math.floor(total / others.length)));
        }

        function modFavor(targetId, delta) {
            game.favor[targetId] = Math.min(100, Math.max(0, game.favor[targetId] + delta));
            recalcTeamAccept();
        }

        function modFanStruct(dSolo, dCp, dGroup) {
            game.soloFans = Math.min(100, Math.max(0, game.soloFans + dSolo));
            game.cpFans = Math.min(100, Math.max(0, game.cpFans + dCp));
            game.groupFans = Math.min(100, Math.max(0, game.groupFans + dGroup));
            recalcFansFromStruct();
        }

        function modLife(delta) { game.life = Math.min(100, Math.max(0, game.life + delta)); }

        function modSkill(delta) { game.skill = Math.min(100, Math.max(0, game.skill + delta)); }

        function triggerRandomEvent() {
            const events = [
                { name: "公司内小考", desc: "月考排名靠后，压力山大", effect: () => { modSkill(-3);
                        modLife(-2);
                        modFanStruct(0, 0, -1); } },
                { name: "公开演唱会", desc: "舞台表现亮眼，圈粉无数", effect: () => { modSkill(2);
                        modFanStruct(1, 2, 2);
                        modLife(1); } },
                { name: "粉丝跟车", desc: "私生跟车，惊吓又疲惫", effect: () => { modLife(-5);
                        modFanStruct(-1, 0, -1); } },
                { name: "杂志双人拍摄", desc: "和队友营业擦出火花", effect: () => { let r = Math.random() > 0.5 ? 2 : -2;
                        modFanStruct(-1, 3, 1);
                        modLife(r); } },
                { name: "新歌分part争议", desc: "歌词分配引发粉圈大战", effect: () => { modFanStruct(-2, 1, -1);
                        modLife(-2); } }
            ];
            let ev = events[Math.floor(Math.random() * events.length)];
            ev.effect();
            return { name: ev.name, desc: ev.desc };
        }

        function advanceWeek(performEventCheck = true) {
            game.week++;
            if ((game.playerId === 'zby' || game.playerId === 'zj') && game.coldWarRemain > 0) game.coldWarRemain--;
            if (game.playerId === 'zh' && game.life < 15) game.life = 0;
            if (game.life <= 0 || game.skill <= 0 || game.teamAccept <= 0 || game.fans <= 0) game.gameOver = true;
            if (game.week > 16) return;
            if (!game.gameOver && game.week <= 16 && performEventCheck && game.week % 2 === 0 && game.week >= game
                .nextEventWeek) {
                const eventRes = triggerRandomEvent();
                game.nextEventWeek = game.week + 2;
                return eventRes;
            }
            return null;
        }

        function checkEnding() {
            if (game.gameOver) {
                if (game.life <= 0) return "身体不适退团";
                if (game.teamAccept <= 0) return "霸凌全团";
                if (game.skill <= 0 && game.teamAccept > 80) return "卖腐丧志";
                if (game.fans <= 0) return "无人在意";
                return "遗憾退场";
            }
            if (game.week > 16) {
                if ((game.playerId === 'zby' || game.playerId === 'sxh') && game.favor[game.playerId === 'zby' ? 'sxh' :
                        'zby'] > 60) return "我磕了对家x我的cp";
                if (game.fans <= 40) return "皇子登基";
                let maxCp = 0;
                for (let id of ['zx', 'zby', 'zj', 'zh', 'sxh'])
                    if (id !== game.playerId && game.cpCounts[id] > maxCp) maxCp = game.cpCounts[id];
                if (maxCp >= 4 && game.skill > 10) return "美帝姐的胜利";
                let allMoreThan2 = ['zx', 'zby', 'zj', 'zh', 'sxh'].filter(id => id !== game.playerId).every(id => game
                    .cpCounts[id] >= 2);
                if (allMoreThan2 && game.skill > 10) return "端水之神降临";
                if (game.sabotageSuccess >= 3) return "钮祜禄";
                if (game.skill > 80 && game.teamAccept > 80 && game.fans > 80) return "全能ACE";
                let allMid = [game.life, game.skill, game.teamAccept, game.fans].every(v => v >= 40 && v <= 60);
                if (allMid) return "平淡是真";
                let allHighFavor = ['zx', 'zby', 'zj', 'zh', 'sxh'].filter(id => id !== game.playerId).every(id => game
                    .favor[id] >= 80);
                if (game.teamAccept > 90 && allHighFavor) return "真爱永恒";
                return "平稳着陆";
            }
            return null;
        }

        function checkRumorTrigger(target, isSixTimes) {
            if (game.rumorTriggered || game.gameOver) return false;
            if (isSixTimes) {
                if (game.playerId === 'zby' && target === 'sxh') return false;
                if (game.playerId === 'sxh' && target === 'zby') return false;
                return true;
            }
            let hasMax = ['zx', 'zby', 'zj', 'zh', 'sxh'].some(id => id !== game.playerId && game.favor[id] >= 100);
            if (hasMax && Math.random() < 0.25) return true;
            return false;
        }

        /* ============================================================
           动作执行 (不变)
        ============================================================ */
        function performAction(action, subTarget = null) {
            if (game.gameOver || game.week > 16) return;
            let actionLog = "",
                storyText = "";

            if (game.playerId === 'zh' && action === 'train') {
                game.consecutiveTrain = (game.consecutiveTrain || 0) + 1;
                if (game.consecutiveTrain >= 3) {
                    game.life = 0;
                    game.gameOver = true;
                    renderGameOverScreen("连续高强度训练，身体彻底垮了……不得不退团休养。");
                    return;
                }
            } else { game.consecutiveTrain = 0; }

            if ((game.playerId === 'zby' || game.playerId === 'zj') && game.week <= 3 && action === 'cp' && subTarget === (
                    game.playerId === 'zby' ? 'zj' : 'zby')) {
                actionLog = "⚠ 冷战期间主动卖腐，两人好感骤降！CP粉愤怒脱粉。";
                modFavor(subTarget, -8);
                modFanStruct(-4, -6, -1);
                storyText = getStory(game.playerId, subTarget);
            } else {
                switch (action) {
                    case 'train':
                        modSkill(4 + Math.floor(Math.random() * 3));
                        modLife(3);
                        actionLog = "✨ 泡在练习室一整天，汗水浇灌实力。技能提升！";
                        break;
                    case 'cp':
                        if (!subTarget) return;
                        let target = subTarget,
                            favDelta = 0,
                            soloD = 0,
                            cpD = 0,
                            groupD = 0;
                        const isZX_SXH = (game.playerId === 'zx' && target === 'sxh') || (game.playerId === 'sxh' &&
                            target === 'zx');
                        const isZB_ZJ = (game.playerId === 'zby' && target === 'zj') || (game.playerId === 'zj' &&
                            target === 'zby');
                        const isZBY_SXH = (game.playerId === 'zby' && target === 'sxh') || (game.playerId === 'sxh' &&
                            target === 'zby');
                        storyText = getStory(game.playerId, target);
                        game.cpCounts[target] = (game.cpCounts[target] || 0) + 1;

                        if ((game.playerId === 'zby' && target === 'sxh' && game.cpCounts['sxh'] >= 6) || (game
                                .playerId === 'sxh' && target === 'zby' && game.cpCounts['zby'] >= 6)) {
                            game.gameOver = true;
                            renderEndingScreen('我磕了对家x我的cp');
                            return;
                        }

                        if (isZX_SXH) { favDelta = 8;
                            soloD = -5;
                            cpD = 1;
                            groupD = -1;
                            actionLog = "💔 和" + (game.playerId === 'zx' ? '苏新皓' : '朱志鑫') + "互动，唯粉撕碎cp图，粉丝总数下降..."; } else if (
                            isZB_ZJ) {
                            if (game.coldWarRemain > 0) { favDelta = -8;
                                soloD = -4;
                                cpD = -6;
                                groupD = -1;
                                actionLog = "💔 冷战中心碎互动，粉丝心碎一地。"; } else { favDelta = 5;
                                soloD = -1;
                                cpD = 6;
                                groupD = 1;
                                actionLog = "💞 破冰互动！美帝姐狂喜，cp粉暴增。"; }
                        } else if (isZBY_SXH) { favDelta = 2;
                            soloD = -3;
                            cpD = 0;
                            groupD = 4;
                            actionLog = "🌱 冒险配对，唯粉震怒，但团粉觉得团结有爱。"; } else { favDelta = 4;
                            soloD = -1;
                            cpD = 4;
                            groupD = 1;
                            actionLog = "💫 温馨互动，新奇感拉满，cp粉悄悄上涨。"; }

                        modFavor(target, favDelta);
                        modFanStruct(soloD, cpD, groupD);

                        if (game.playerId === 'zx') {
                            if (target !== 'sxh') game.zx_noSuCounter++;
                            else game.zx_noSuCounter = 0;
                            if (game.zx_noSuCounter >= 2) { triggerZXLetter();
                                actionLog += " ✉ 苏新皓写了一封信，你心情低落。"; }
                        }
                        if (game.playerId === 'sxh') {
                            if (target !== 'zx') game.sxh_noZxCounter++;
                            else game.sxh_noZxCounter = 0;
                            if (game.sxh_noZxCounter >= 2) { triggerSXHVisit();
                                actionLog += " 🌙 朱志鑫半夜来访，气氛微妙。"; }
                        }

                        if (game.cpCounts[target] >= 6) {
                            if (checkRumorTrigger(target, true)) { game.rumorTriggered = true;
                                game.gameOver = true;
                                renderEndingScreen('同性恋传闻爆发'); return; }
                        } else {
                            if (checkRumorTrigger(target, false)) { game.rumorTriggered = true;
                                game.gameOver = true;
                                renderEndingScreen('同性恋传闻爆发'); return; }
                        }
                        break;

                    case 'sabotage':
                        let success = Math.random() > 0.4;
                        if (success) {
                            let keys = Object.keys(game.relation),
                                chosen = keys[Math.floor(Math.random() * keys.length)];
                            game.relation[chosen] = Math.max(0, game.relation[chosen] - Math.floor(Math.random() * 8 +
                            5));
                            game.sabotageSuccess++;
                            actionLog = `🕯️ 成功离间！某一对队友关系恶化，你深藏功与名。(成功${game.sabotageSuccess}次)`;
                            modLife(-1);
                        } else {
                            actionLog = "😓 离间失败，被怀疑了，队友对你产生隔阂。";
                            let randomMate = ['zx', 'zby', 'zj', 'zh', 'sxh'].find(m => m !== game.playerId);
                            modFavor(randomMate, -3);
                            modLife(-2);
                        }
                        break;
                    case 'sj':
                        let feel = Math.random() > 0.5 ? "粉丝夸你可爱，心情大好" : "黑帖让人失眠";
                        modLife(feel.includes('大好') ? 2 : -2);
                        modFanStruct(Math.floor(Math.random() * 3) - 1, Math.floor(Math.random() * 3) - 1, Math.floor(
                            Math.random() * 3) - 1);
                        actionLog = `📱 深夜视奸粉圈... ${feel}`;
                        break;
                }
            }

            game.soloFans = Math.min(100, Math.max(0, game.soloFans));
            game.cpFans = Math.min(100, Math.max(0, game.cpFans));
            game.groupFans = Math.min(100, Math.max(0, game.groupFans));
            recalcFansFromStruct();

            let eventInfo = advanceWeek(true);
            if (eventInfo) actionLog += `  【${eventInfo.name}】${eventInfo.desc}`;

            game.lastAction = action;
            game.lastTarget = subTarget;

            let finalMsg = actionLog;
            if (action === 'cp' && storyText) finalMsg = storyText + "\n\n" + actionLog;

            let ending = checkEnding();
            if (game.gameOver && ending) { renderGameOverScreen("💔游戏结束：" + ending); return; }
            if (game.week > 16) { renderEndingPreview(finalMsg); } else { renderMainGame(finalMsg); }
        }

        function triggerZXLetter() { modLife(-3);
            modFanStruct(-1, 0, 0);
            game.zx_noSuCounter = 0; }

        function triggerSXHVisit() { modLife(-3);
            modFanStruct(-1, 0, 0);
            game.sxh_noZxCounter = 0; }

        /* ============================================================
           渲染函数
        ============================================================ */
        function statsHTML() {
            return `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">❤️ 生命值</div>
                <div class="stat-value">${game.life}</div>
                <div class="stat-bar"><div class="bar-fill fill-health" style="width:${game.life}%"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🎤 技　能</div>
                <div class="stat-value">${game.skill}</div>
                <div class="stat-bar"><div class="bar-fill fill-skill" style="width:${game.skill}%"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🤝 接　纳</div>
                <div class="stat-value">${game.teamAccept}</div>
                <div class="stat-bar"><div class="bar-fill fill-accept" style="width:${game.teamAccept}%"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">👑 粉　丝</div>
                <div class="stat-value">${game.fans}</div>
                <div class="stat-bar"><div class="bar-fill fill-fans" style="width:${game.fans}%"></div></div>
            </div>
        </div>`;
        }

        function renderMainGame(extraMessage = "") {
            const root = document.getElementById('root');
            let msg = extraMessage || `✨ 第${game.week}周 · 新的一周，新的选择。`;
            root.innerHTML = `
        <div class="game-container">
            ${makeWindowTitlebar('TOP · 卖腐模拟器')}
            <div class="game-inner">
                <div class="meta-bar">
                    <span class="role-tag">▶ ${game.playerName}</span>
                    <span class="week-tag">WEEK ${game.week} / 16</span>
                </div>
                ${makeWeekPips(game.week)}
                <div class="deco-strip">★ ♥ ● ✿ ◆ ～ ★ ♥ ● ✿ ◆ ～ ★ ♥ ●</div>
                <div class="story-panel" style="margin-top:8px">
                    <div class="story-text">${msg.replace(/\n/g,'<br>')}</div>
                </div>
                ${statsHTML()}
                <div class="divider"></div>
                <div class="action-buttons">
                    <button class="action-btn" data-action="train">✦刻苦训练✦</button>
                    <button class="action-btn" data-action="cp">✦找队友卖腐✦</button>
                    <button class="action-btn" data-action="sabotage">✦离间队友✦</button>
                    <button class="action-btn" data-action="sj">✦视奸粉圈✦</button>
                </div>
            </div>
            <footer>✦每一步改变命运✦</footer>
        </div>`;
            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', () => {
                    let act = btn.dataset.action;
                    if (act === 'cp') renderTeammateSelect();
                    else performAction(act);
                });
            });
        }

        function renderTeammateSelect() {
            const root = document.getElementById('root');
            const teammates = ['zx', 'zby', 'zj', 'zh', 'sxh'].filter(id => id !== game.playerId);
            const nameMap = { zx: '✦朱志鑫✦', zby: '✦张泽禹✦', zj: '✦张极✦', zh: '✦左航✦', sxh: '✦苏新皓✦' };
            const iconMap = { zx: '', zby: '', zj: '', zh: '', sxh: '' };
            let btns = teammates.map(id => `<button class="teammate-btn" data-target="${id}">${iconMap[id]} ${nameMap[id]}</button>`)
                .join('');
            root.innerHTML = `
        <div class="game-container">
            ${makeWindowTitlebar('SELECT · PARTNER')}
            <div class="game-inner">
                <div class="deco-strip" style="margin:10px 0 4px">♥ ★ ✿ ● ◆ ～ ♥ ★ ✿ ● ◆ ～</div>
                <div class="story-panel">
                    <div class="story-text"> 选择一位队友，开启专属互动剧情
<span style="font-size:0.78rem;color:var(--pink-4)">每次选择都至关重要❗️</span></div>
                </div>
                <div class="teammate-grid" style="margin-top:12px">
                    ${btns}
